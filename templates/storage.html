{% extends "base.html" %}
{% block main %}
<div class="top-bar">
  <div>
    <h2>RAID storage</h2>
    <p>Mirror status on {{ status.hostname }} · Samba LAN share · ClamAV scanning</p>
  </div>
</div>

<div id="storageActionResult"></div>

<div id="storagePanel"
     hx-get="/partials/storage-overview"
     hx-trigger="load, every 10s [!storagePanelUserEditing()], refreshStorage from:body"
     hx-swap="innerHTML">
  {% include "partials/storage_overview.html" %}
</div>
{% endblock %}

{% block scripts %}
<script>
  function storagePanelUserEditing() {
    var panel = document.getElementById("storagePanel");
    if (!panel) return false;
    var el = document.activeElement;
    if (!el || !panel.contains(el)) return false;
    return el.matches("input, textarea, select");
  }

  document.body.addEventListener("htmx:afterSwap", function (e) {
    if (e.detail.target.id !== "storageActionResult") return;
    var ok = document.querySelector("#storageActionResult .action-result.ok");
    if (!ok) return;
    var form = document.getElementById("samba-add-user-form");
    if (form) {
      form.reset();
      resetSambaNewAccessToggle(form);
    }
    document.querySelectorAll(".samba-password-panel[open] .samba-password-form").forEach(function (pwForm) {
      pwForm.reset();
      var panel = pwForm.closest(".samba-password-panel");
      if (panel) panel.open = false;
    });
  });

  function syncSambaNewAccessToggle(wrap, writeEnabled) {
    if (!wrap) return;
    var hidden = wrap.closest("form") && wrap.closest("form").querySelector('input[name="access"]');
    var btn = wrap.querySelector(".samba-new-access-toggle");
    var readLabel = wrap.querySelector('[data-side="read"]');
    var writeLabel = wrap.querySelector('[data-side="write"]');
    if (btn) btn.setAttribute("aria-checked", writeEnabled ? "true" : "false");
    if hidden) hidden.value = writeEnabled ? "write" : "read";
    if (readLabel) readLabel.classList.toggle("on", !writeEnabled);
    if (writeLabel) writeLabel.classList.toggle("on", writeEnabled);
  }

  function resetSambaNewAccessToggle(form) {
    var wrap = form && form.querySelector(".samba-new-access-row .samba-access-toggle-wrap");
    syncSambaNewAccessToggle(wrap, true);
  }

  document.body.addEventListener("click", function (e) {
    var btn = e.target.closest(".samba-new-access-toggle");
    if (!btn) return;
    e.preventDefault();
    var wrap = btn.closest(".samba-access-toggle-wrap");
    var writeEnabled = btn.getAttribute("aria-checked") !== "true";
    syncSambaNewAccessToggle(wrap, writeEnabled);
  });
</script>
{% endblock %}
