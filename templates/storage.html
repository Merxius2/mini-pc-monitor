{% extends "base.html" %}
{% block main %}
<div class="top-bar">
  <div>
    <h2>RAID storage</h2>
    <p>Mirror status on {{ status.hostname }} · Samba LAN share · ClamAV scanning</p>
  </div>
</div>

<div id="storageActionResult"></div>

<div id="storagePanel"
     hx-get="/partials/storage-overview"
     hx-trigger="load, every 10s [!storagePanelUserEditing()], refreshStorage from:body"
     hx-swap="innerHTML">
  {% include "partials/storage_overview.html" %}
</div>
{% endblock %}

{% block scripts %}
<script>
  function storagePanelUserEditing() {
    var panel = document.getElementById("storagePanel");
    if (!panel) return false;
    var el = document.activeElement;
    if (!el || !panel.contains(el)) return false;
    return el.matches("input, textarea, select");
  }

  document.body.addEventListener("htmx:afterSwap", function (e) {
    if (e.detail.target.id !== "storageActionResult") return;
    var ok = document.querySelector("#storageActionResult .action-result.ok");
    if (!ok) return;
    var form = document.getElementById("samba-add-user-form");
    if (form) form.reset();
  });
</script>
{% endblock %}
