{% extends "base.html" %}
{% block main %}
<div class="top-bar">
  <div>
    <h2>Torrents</h2>
    <p>Transmission on {{ status.hostname }} · files land in Samba <strong>Downloads</strong></p>
  </div>
</div>

<div id="torrentActionResult"></div>

<div id="torrentsPanel"
     hx-get="/partials/torrents-overview"
     hx-trigger="load, every 10s [!torrentsPanelUserEditing()], refreshTorrents from:body"
     hx-swap="innerHTML">
  {% include "partials/torrents_overview.html" %}
</div>
{% endblock %}

{% block scripts %}
<script>
  function torrentsPanelUserEditing() {
    var panel = document.getElementById("torrentsPanel");
    if (!panel) return false;
    var el = document.activeElement;
    if (!el || !panel.contains(el)) return false;
    return el.matches("input, textarea, select");
  }

  function bindTorrentDropZone(root) {
    var zone = root && root.querySelector("#torrent-drop-zone");
    if (!zone || zone.dataset.dropBound === "1") return;
    zone.dataset.dropBound = "1";
    var form = zone.querySelector("#torrent-upload-form");
    var input = zone.querySelector("#torrent-file-input");
    if (!form || !input) return;

    function isTorrentFile(file) {
      if (!file) return false;
      var name = (file.name || "").toLowerCase();
      return name.endsWith(".torrent") || file.type === "application/x-bittorrent";
    }

    function uploadFile(file) {
      if (!isTorrentFile(file)) {
        alert("Drop a .torrent file");
        return;
      }
      var dt = new DataTransfer();
      dt.items.add(file);
      input.files = dt.files;
      if (typeof htmx !== "undefined") htmx.trigger(form, "submit");
      else form.requestSubmit();
    }

    ["dragenter", "dragover"].forEach(function (ev) {
      zone.addEventListener(ev, function (e) {
        e.preventDefault();
        e.stopPropagation();
        zone.classList.add("torrent-drop-zone-active");
      });
    });
    ["dragleave", "drop"].forEach(function (ev) {
      zone.addEventListener(ev, function (e) {
        e.preventDefault();
        e.stopPropagation();
        zone.classList.remove("torrent-drop-zone-active");
      });
    });
    zone.addEventListener("drop", function (e) {
      var files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length) uploadFile(files[0]);
    });
  }

  function initTorrentsPanel(root) {
    bindTorrentDropZone(root || document.getElementById("torrentsPanel"));
  }

  initTorrentsPanel(document.getElementById("torrentsPanel"));

  document.body.addEventListener("htmx:afterSwap", function (e) {
    if (e.detail.target.id === "torrentsPanel") {
      initTorrentsPanel(e.detail.target);
    }
    if (e.detail.target.id !== "torrentActionResult") return;
    var ok = document.querySelector("#torrentActionResult .action-result.ok");
    if (!ok) return;
    var magnetForm = document.getElementById("torrent-magnet-form");
    if (magnetForm) magnetForm.reset();
    var torrentInput = document.getElementById("torrent-file-input");
    if (torrentInput) torrentInput.value = "";
  });
</script>
{% endblock %}
