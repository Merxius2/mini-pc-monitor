{% extends "base.html" %}
{% block main %}
<div class="top-bar">
  <div>
    <h2>Services</h2>
    <p>systemd units on {{ status.hostname }} · start/stop/restart requires passwordless sudo</p>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    Managed services
    <span class="badge">{{ service_count }} configured</span>
  </div>
  <div id="servicesPanel"
       hx-get="/partials/services"
       hx-trigger="load, every 30s, refreshServices from:body"
       hx-swap="innerHTML">
    <div class="services-loading">Loading services…</div>
  </div>
  <div id="actionResult"></div>
</div>
{% endblock %}
