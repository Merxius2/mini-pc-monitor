server:
  host: 0.0.0.0
  port: 8080

# Friendly label shown in the sidebar (defaults to system hostname)
hostname_label: null

services:
  - unit: good-search-mcp.service
    label: Good-search MCP
    manage: true
    logs: true
  - unit: pricewatch.service
    label: Pricewatch
    manage: true
    logs: true
    dashboard_url: http://192.168.1.30:8081/
  - unit: ollama.service
    label: Ollama
    manage: true
    logs: true
  - unit: homeassistant.service
    label: Home Assistant
    manage: true
    logs: true
    dashboard_url: http://192.168.1.30:8123/
  - unit: domoticz.service
    label: Domoticz
    manage: true
    logs: true
    dashboard_url: http://192.168.1.30:8082/
  - unit: smbd.service
    label: Samba (RAID share)
    manage: true
    logs: true
    dashboard_url: /storage#samba
  - unit: transmission-daemon.service
    label: Transmission
    manage: true
    logs: true
    dashboard_url: /storage#torrents
  - unit: clamav-daemon.service
    label: ClamAV
    manage: true
    logs: true
    dashboard_url: /storage#clamav
  - unit: mini-pc-monitor.service
    label: Mini-PC Monitor
    manage: false
    logs: true
  - unit: azerothcore.service
    label: AzerothCore WoW Server
    manage: true
    logs: true

top_processes_limit: 8

process_labels:
  - label: Good-search MCP
    color: cyan
    patterns: [chrome, chromium, tailscale, tailscaled]
  - label: AzerothCore
    color: amber
    patterns: [worldserver, authserver, mysqld, mysql]
  - label: Ollama
    color: green
    patterns: [ollama, llama-server]
  - label: Mini-PC Monitor
    color: purple
    patterns: [uvicorn]
    users: [sylvester]
  - label: Pricewatch
    color: blue
    patterns: [uvicorn]
    users: [pricewatch]
  - label: Home Assistant
    color: orange
    patterns: [go2rtc]
    cmdline_patterns: ["-m homeassistant", "home-assistant"]
  - label: Domoticz
    color: teal
    patterns: [domoticz]

pricewatch:
  enabled: true
  systemd_unit: pricewatch.service
  # Mini-PC Monitor uses 8080; Pricewatch defaults to 8081 when co-installed
  health_url: http://127.0.0.1:8081/health
  stats_url: http://127.0.0.1:8081/api/stats
  dashboard_url: http://192.168.1.30:8081/

homeassistant:
  enabled: true
  systemd_unit: homeassistant.service
  container_name: homeassistant
  health_url: http://127.0.0.1:8123/
  dashboard_url: http://192.168.1.30:8123/
  rflink_device: /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0

domoticz:
  enabled: true
  systemd_unit: domoticz.service
  container_name: domoticz
  health_url: http://127.0.0.1:8082/
  dashboard_url: http://192.168.1.30:8082/
  rflink_device: /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0

storage:
  enabled: true
  mount: /mnt/storage
  md_device: /dev/md0

samba:
  enabled: true
  systemd_unit: smbd.service
  share_name: storage
  share_path: /mnt/storage/shared
  unc_path: //192.168.1.30/storage

transmission:
  enabled: true
  systemd_unit: transmission-daemon.service
  rpc_url: http://127.0.0.1:9091/transmission/rpc
  rpc_username: transmission
  rpc_password_file: /etc/mini-pc-monitor/transmission-rpc-password
  download_dir: /mnt/storage/shared/Downloads
  incomplete_dir: /mnt/storage/downloads/incomplete
  watch_dir: /mnt/storage/torrents/watch

clamav:
  enabled: true
  daemon_unit: clamav-daemon.service
  freshclam_unit: clamav-freshclam.service
  scan_log: /mnt/storage/logs/clamav-scan.log

system_updates:
  enabled: true
  helper_script: /usr/local/sbin/minipc-system-update
  max_packages_shown: 12

video_download:
  enabled: true
  download_dir: /mnt/storage/shared/Downloads/videos
  allowed_hosts:
    - youporn.com
    - www.youporn.com
  download_timeout_seconds: 3600
  max_recent_files: 15

azerothcore:
  enabled: true
  label: AzerothCore WoW Server
  systemd_unit: azerothcore.service
  manage: true
  mysql_unit: mysql.service
  mysql_port: 3306
  auth_process: authserver
  auth_port: 3724
  world_process: worldserver
  world_port: 8085
  auth_tmux_session: auth-session
  world_tmux_session: world-session

sleep_schedule:
  nightly_off_timer: minipc-nightly-off.timer
  nightly_off_service: minipc-nightly-off.service
  keep_awake_timer: minipc-keep-awake.timer
  keep_awake_service: minipc-keep-awake.service
  suspend_script: /usr/local/sbin/minipc-poweroff-until-morning.sh
  manage: true
