server:
  host: 0.0.0.0
  port: 8080

# Friendly label shown in the sidebar (defaults to system hostname)
hostname_label: null

services:
  - unit: good-search-mcp.service
    label: Good-search MCP
    manage: true
    logs: true
  - unit: pricewatch.service
    label: Pricewatch
    manage: true
    logs: true
    dashboard_url: http://192.168.1.30:8081/
  - unit: ollama.service
    label: Ollama
    manage: true
    logs: true
  - unit: mini-pc-monitor.service
    label: Mini-PC Monitor
    manage: false
    logs: true
  - unit: azerothcore.service
    label: AzerothCore WoW Server
    manage: true
    logs: true

top_processes_limit: 8

process_labels:
  - label: Good-search MCP
    color: cyan
    patterns: [chrome, chromium, tailscale, tailscaled]
  - label: AzerothCore
    color: amber
    patterns: [worldserver, authserver, mysqld, mysql]
  - label: Ollama
    color: green
    patterns: [ollama]
  - label: Mini-PC Monitor
    color: purple
    patterns: [uvicorn]
    users: [sylvester]
  - label: Pricewatch
    color: blue
    patterns: [uvicorn]
    users: [pricewatch]

pricewatch:
  enabled: true
  systemd_unit: pricewatch.service
  # Mini-PC Monitor uses 8080; Pricewatch defaults to 8081 when co-installed
  health_url: http://127.0.0.1:8081/health
  stats_url: http://127.0.0.1:8081/api/stats
  dashboard_url: http://192.168.1.30:8081/

azerothcore:
  enabled: true
  label: AzerothCore WoW Server
  systemd_unit: azerothcore.service
  manage: true
  mysql_unit: mysql.service
  mysql_port: 3306
  auth_process: authserver
  auth_port: 3724
  world_process: worldserver
  world_port: 8085
  auth_tmux_session: auth-session
  world_tmux_session: world-session

sleep_schedule:
  nightly_off_timer: minipc-nightly-off.timer
  nightly_off_service: minipc-nightly-off.service
  keep_awake_timer: minipc-keep-awake.timer
  keep_awake_service: minipc-keep-awake.service
  suspend_script: /usr/local/sbin/minipc-poweroff-until-morning.sh
  manage: true
