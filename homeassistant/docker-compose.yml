services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    network_mode: host
    devices:
      - ${RFLINK_DEVICE:-/dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0}:/dev/rflink
